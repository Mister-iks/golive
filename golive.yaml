# PcyBox GoLive checks itself on every push: golive check --repo .
# This describes the reference installation (docker-compose.yml): one host, used by a team.
spec: golive/v1
project:
  name: PcyBox GoLive Community
  type: internal-tool
  description: Self-hosted go / no-go platform for a team. Web app, audit worker and PostgreSQL on one Docker host.
  countries: [ SN, FR ]
  languages: [ en, fr ]
  audience: internal
data:
  # Team accounts: name and e-mail.
  personal: [ identity, contact ]
features: [ accounts, admin, email ]
zones:
  - id: host
    name: Docker host
    network: private
actors:
  - id: team
    kind: user
    name: Team members
  - id: sites
    kind: system
    name: Audited sites
components:
  - id: web
    kind: frontend
    name: Web app and API
    tech: nextjs@16
    runtime: nodejs@22
    zone: host
  - id: worker
    kind: backend
    name: Audit worker
    tech: playwright@1.65
    runtime: nodejs@22
    zone: host
    notes: Passive GET requests only, through an SSRF-guarded proxy. Full audits need proof of domain ownership.
  - id: db
    kind: database
    name: PostgreSQL
    tech: postgresql@17
    zone: host
    notes: Row level security per organization; also hosts the job queue (pg-boss).
  - id: backup
    kind: backup
    name: Daily database dump
    tech: pg_dump
    zone: host
    notes: Written to ./backups on the host, kept 14 days. The operator copies it off the host (docs/operations.md).
  - id: mail
    kind: email
    name: SMTP relay
    tech: smtp
links:
  - { from: team, to: web, protocol: https }
  - { from: web, to: db, protocol: postgres-tls, sensitivity: personal }
  - { from: worker, to: db, protocol: postgres-tls }
  - { from: db, to: backup, protocol: postgres-tls, sensitivity: personal }
  - { from: worker, to: sites, protocol: https }
  - { from: web, to: mail, protocol: smtps, sensitivity: personal }
layout:
  team: [ 0, 120 ]
  web: [ 260, 100 ]
  worker: [ 260, 300 ]
  db: [ 540, 200 ]
  mail: [ 540, 20 ]
  backup: [ 800, 200 ]
  sites: [ 0, 320 ]
