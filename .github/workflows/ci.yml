name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: |
          cli="$GITHUB_WORKSPACE/apps/cli/dist/golive.js"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          node "$cli" init --template saas-b2b
          node "$cli" validate
          node "$cli" check --as-of 2026-11-24 --fail-on never
      - name: PcyBox GoLive checks itself
        run: node apps/cli/dist/golive.js check --repo . --format markdown --fail-on never >> "$GITHUB_STEP_SUMMARY"
