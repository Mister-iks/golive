name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: golive
          POSTGRES_PASSWORD: golive
          POSTGRES_DB: golive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U golive -d golive_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Row level security tests run against this real database.
      DATABASE_URL_TEST: postgres://golive:golive@localhost:5432/golive_test
      # Build-time placeholder: no connection is opened while building.
      DATABASE_URL: postgres://build@localhost:5432/build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: |
          cli="$GITHUB_WORKSPACE/apps/cli/dist/golive.js"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          node "$cli" init --template saas-b2b
          node "$cli" validate
          node "$cli" check --as-of 2026-11-24 --fail-on never
      - name: PcyBox GoLive checks itself (through the reusable action)
        uses: ./
        with:
          cli: apps/cli/dist/golive.js
          fail-on: never

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the images
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
        run: docker compose build
      - name: Start the stack and check it answers
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
        run: |
          docker compose up -d --wait web worker
          curl -fsS http://localhost:3000/api/config
          # The worker sends a heartbeat at start-up; give it a few seconds.
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && break; sleep 3; done
          curl -fsS http://localhost:3000/api/health
          # Every client connection to PostgreSQL is encrypted.
          test "$(docker compose exec -T db psql -U golive -d golive -tAc "select count(*) from pg_stat_ssl s join pg_stat_activity a using (pid) where a.datname = 'golive' and a.usename = 'golive' and not s.ssl and a.pid <> pg_backend_pid()")" = "0"
          # One real backup through the backup service (TLS with certificate check).
          docker compose run --rm --entrypoint pg_dump backup --format=custom --file=/backups/ci.dump
          test -s backups/ci.dump
          docker compose logs migrate worker | tail -20
          docker compose down -v
