name: Release

# Publishes @pcybox/golive to npm when a version tag is pushed, for example v0.1.1.
# Authentication uses npm trusted publishing (OpenID Connect): no npm token is stored in GitHub.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @pcybox/golive build
      - name: Tag and package version must match
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version" >&2
            exit 1
          fi
      - name: Smoke test the packaged CLI
        run: |
          cd apps/cli && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y >/dev/null && npm install "$RUNNER_TEMP"/pcybox-golive-*.tgz
          npx golive init --template saas-b2b
          npx golive check --as-of 2026-11-24 --fail-on never
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - name: Publish
        working-directory: apps/cli
        run: npm publish --access public
